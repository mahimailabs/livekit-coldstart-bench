# Cerebrium: registered worker, same shape as Cerebrium's own LiveKit examples.
# Secrets LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET go in the Cerebrium dashboard.
# Run `cerebrium deploy` from bench/ with this file copied there.
[cerebrium.deployment]
name = "lk-bench"
python_version = "3.12"
include = ["agent/*", "platforms/Dockerfile"]

[cerebrium.hardware]
cpu = 2
memory = 4.0
compute = "CPU"

[cerebrium.scaling]
# min_replicas = 0 for the scale-to-zero test, 1 for the warm test
min_replicas = 0
max_replicas = 3
cooldown = 30
replica_concurrency = 1
response_grace_period = 900
scaling_metric = "cpu_utilization"
scaling_target = 80

[cerebrium.runtime.custom]
port = 8081
dockerfile_path = "./platforms/Dockerfile"
