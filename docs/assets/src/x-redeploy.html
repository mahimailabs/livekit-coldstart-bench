<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>X redeploy</title>
<link rel="stylesheet" href="style.css">
<style>#stage { width: 1200px; height: 675px; }</style>
</head>
<body>
<div id="stage"><svg id="s" width="1200" height="675" viewBox="0 0 1200 675"></svg></div>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script src="common.js"></script>
<script>
// A live call through a redeploy, 16:9 for X (hold runs in results/).
(async () => {
await fontsReady();
const { rc, o, hf, add, T } = setup("s", 43);
T(null, 40, 66, "Redeploy during a live call", { anchor: "start", size: 50, weight: 700 });
T(null, 40, 104, "what the caller hears (gaps measured, positions approximate)", { anchor: "start", size: 23, cls: "m" });

const X0 = 300, X1 = 1160, SPAN = 150, RD = 60;
const sx = (s) => X0 + (s / SPAN) * (X1 - X0);
const lanes = [
  { name: "Cerebrium", note: "call survives, 600 s", gap: null },
  { name: "Cloud Run", note: "worker pool", gap: [RD + 9, RD + 9 + 23] },
  { name: "Fargate", note: "ECS stopTimeout 30 s", gap: [RD + 30, RD + 30 + 21] },
];
add(null, rc.line(sx(RD), 150, sx(RD), 580, o({ stroke: C.yellow, strokeWidth: 2.4, strokeLineDash: [7, 8], roughness: 0.7 })));
T(null, sx(RD), 144, "redeploy", { size: 24, weight: 700, fill: C.yellow });

lanes.forEach((L, i) => {
  const y = 200 + i * 132;
  T(null, X0 - 22, y + 30, L.name, { anchor: "end", size: 32, weight: 700, fill: L.gap ? C.ink : C.green });
  T(null, X0 - 22, y + 60, L.note, { anchor: "end", size: 19, cls: "m" });
  const ok = !L.gap;
  const tick = (s, big) => add(null, rc.rectangle(sx(s), y + (big ? 6 : 16), big ? sx(s + 3) - sx(s) : 6, big ? 42 : 22,
    o({ stroke: ok ? C.green : C.blue, strokeWidth: 1.3, ...hf(ok ? C.greenF : C.blueF, "solid"), roughness: 0.8 })));
  tick(0, true);
  for (let s = 4; s < SPAN; s += 2.5) {
    if (L.gap && s >= L.gap[0] - 1 && s < L.gap[1]) continue;
    tick(s, false);
  }
  if (L.gap) {
    const [a, b] = L.gap;
    add(null, rc.rectangle(sx(a), y, sx(b) - sx(a), 54, o({ stroke: C.red, strokeWidth: 2.2, ...hf(C.redF) })));
    T(null, (sx(a) + sx(b)) / 2, y + 37, `${b - a} s`, { size: 30, weight: 700, fill: C.red });
    tick(b + 0.5, true);
    T(null, sx(b + 4), y + 84, "silence, then a new agent", { anchor: "start", size: 20, fill: C.red });
  } else {
    T(null, sx(RD + 4), y + 84, "no gap", { anchor: "start", size: 20, fill: C.green });
  }
});
add(null, rc.line(X0, 600, X1, 600, o({ stroke: C.muted, strokeWidth: 1.4, roughness: 0.8 })));
[0, 30, 60, 90, 120, 150].forEach((s) => T(null, sx(s), 630, `${s} s`, { size: 19, cls: "m" }));
window.ready = true;
})();
</script>
</body>
</html>
